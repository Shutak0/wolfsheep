        .sort-btn.active { border-color: #c084fc; background: #1a1030; color: #c084fc; }
        .replay-card { background: #0d0d1a; border: 2px solid #2a1a5a; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.2s; }

        .replay-card-left { flex: 1; min-width: 0; }
        .replay-card-players { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
        .replay-card-name { color: #e0e0f0; font-size: 15px; font-weight: 600; }
        .replay-card-vs { color: #555; font-size: 13px; }
        .replay-card-winner { color: #33ff66; font-size: 11px; font-weight: 600; }
        .replay-card-meta { display: flex; gap: 16px; flex-wrap: wrap; }
        .replay-card-meta span { color: #94a3b8; font-size: 12px; }
        .replay-card-meta .moves { color: #00ffff; font-weight: 600; }
        .replay-card-right { color: #c084fc; font-size: 20px; flex-shrink: 0; }
        .replay-empty { text-align: center; color: #555; padding: 60px 20px; font-size: 16px; }
        .replay-loading { text-align: center; color: #94a3b8; padding: 40px; }
    </style>

    <script>
    (function(){
        var list = document.getElementById('replays-list');
        var sortBtns = document.querySelectorAll('.sort-btn');
        var currentSort = 'date';

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(iso) {
            var d = new Date(iso);
            var now = new Date();
            var diff = now - d;
            if (diff < 86400000) return 'Today ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            if (diff < 172800000) return 'Yesterday ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            return d.toLocaleDateString([], {month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        }

        function loadReplays(sort) {
            list.innerHTML = '<div class="replay-loading">Loading replays...</div>';
            fetch('/api/games/all?sort=' + sort)
                .then(function(r){return r.json();})
                .then(function(data){
                    if (!data.success || !data.games || !data.games.length) {
                        list.innerHTML = '<div class="replay-empty">No replays found yet.<br>Play a game to create one! 🎮</div>';
                        return;
                    }
                    var html = '';
                    data.games.forEach(function(g){
                        var p0 = (g.players && g.players[0]) ? g.players[0].name : 'Red';
                        var p1 = (g.players && g.players[1]) ? g.players[1].name : 'Green';
                        var winnerName = g.winnerName || ((g.winner === 0) ? p0 : p1);
                        var tcLabel = g.timeControl || '1+5';
                        html += '<div class="replay-card" onclick="location.href=\'/game.html?id=' + g.id + '\'">' +
                            '<div class="replay-card-left">' +
                                '<div class="replay-card-players">' +
                                    '<span class="replay-card-name">' + escapeHtml(p0) + '</span>' +
                                    '<span class="replay-card-vs">vs</span>' +
                                    '<span class="replay-card-name">' + escapeHtml(p1) + '</span>' +
                                    '<span class="replay-card-winner">🏆 ' + escapeHtml(winnerName) + '</span>' +
                                '</div>' +
                                '<div class="replay-card-meta">' +
                                    '<span>' + formatDate(g.createdAt) + '</span>' +
                                    '<span>' + tcLabel + '</span>' +
                                    '<span class="moves">' + (g.totalMoves || 0) + ' moves</span>' +
                                '</div>' +
                            '</div>' +
                            '<div class="replay-card-right">▶</div>' +
                        '</div>';
                    });
                    list.innerHTML = html;
                })
                .catch(function(){
                    list.innerHTML = '<div class="replay-empty">Failed to load replays. Try again later.</div>';
                });
        }

        sortBtns.forEach(function(btn){
            btn.addEventListener('click', function(){
                sortBtns.forEach(function(b){b.classList.remove('active');});
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                loadReplays(currentSort);
            });
        });

        loadReplays(currentSort);
    })();
    </script>
